ss=\"page-index\">01 / PROJECTS<\/span><h1>My <em>Projects<\/em><\/h1><p>직접 구현하고, 예상하지 못한 문제를 해결하며 배운 기록입니다.<\/p><\/div><span class=\"heading-flower\">✳<\/span><\/div><div class=\"listing-grid\"><a href=\"#/projects/memore\" class=\"content-card\"><div class=\"content-card-art\"><span class=\"content-card-number\">01 / MOBILE APP<\/span><div class=\"art art-memore\"><span class=\"art-floating-star\">✳<\/span><div class=\"ticket-mini\"><div class=\"ticket-top\">♡ A LITTLE MEMORY<\/div><div class=\"ticket-picture\"><span>✿<\/span><div><\/div><\/div><strong>MEMO:RE<\/strong><small>today becomes a keepsake.<\/small><div class=\"ticket-line\"><\/div><span class=\"ticket-foot\">2026 · MEMORY TICKET<\/span><\/div><\/div><\/div><div class=\"content-card-info\"><div class=\"card-name\"><h2>MEMO:RE<\/h2><span class=\"card-go\">↗<\/span><\/div><p>추억을 티켓으로 기록하는 앱. 화면 구현을 넘어 데이터 검증과 개발 환경, 이미지 호환성을 고민했습니다.<\/p><div class=\"tag-row\"><span>React Native<\/span><span>TypeScript<\/span><span>Expo<\/span><\/div><small class=\"card-footer\">2026.09 – 진행 중 · 산학협력 팀 프로젝트<\/small><\/div><\/a><a href=\"#/projects/game\" class=\"content-card\"><div class=\"content-card-art\"><span class=\"content-card-number\">02 / GAME<\/span><div class=\"art art-game\"><span class=\"art-game-star\">✳<\/span><div class=\"game-machine\"><div class=\"machine-top\"><span>♡<\/span><span>STAGE 03<\/span><span>✦<\/span><\/div><div class=\"game-clouds\"><span>☁<\/span><span>☁<\/span><span>☁<\/span><\/div><div class=\"game-food\"><span>🍓<\/span><span>🍪<\/span><span>🍋<\/span><\/div><div class=\"game-player\">◕‿◕<\/div><div class=\"game-ground\"><\/div><\/div><\/div><\/div><div class=\"content-card-info\"><div class=\"card-name\"><h2>하늘에서 음식이 내린다면<\/h2><span class=\"card-go\">↗<\/span><\/div><p>Kotlin으로 만든 3단계 아케이드 게임. 입력·상태 처리와 AI 생성 코드의 구조를 비교했습니다.<\/p><div class=\"tag-row\"><span>Kotlin<\/span><span>LibGDX<\/span><span>Gradle<\/span><\/div><small class=\"card-footer\">2026.05 – 06 · 3인 팀 프로젝트<\/small><\/div><\/a><\/div><div class=\"page-end-hint\">카드를 누르면 자세한 내용을 볼 수 있어요. <span>♡<\/span><\/div><\/main>", "/activities": "<main id=\"main\" class=\"shell inner-main\"><div class=\"page-heading\"><a href=\"#/\" class=\"back-link\"><span>←<\/span> Home<\/a><div class=\"heading-copy\"><span class=\"page-index\">02 / ACTIVITIES<\/span><h1>My <em>Activities<\/em><\/h1><p>궁금한 것을 조사하고, 함께 일하는 방식을 개선하려고 노력한 경험입니다.<\/p><\/div><span class=\"heading-flower\">✳<\/span><\/div><div class=\"listing-grid\"><a href=\"#/activities/kaist\" class=\"content-card\"><div class=\"content-card-art\"><span class=\"content-card-number\">01 / RESEARCH<\/span><div class=\"art art-ai\"><div class=\"agent-card agent-a\"><small>agent A<\/small><strong>추천인가요?<\/strong><\/div><span class=\"agent-connector\">⋯⋯↗<\/span><div class=\"agent-card agent-b\"><small>agent B<\/small><strong>명령인가요?<\/strong><\/div><span class=\"agent-note\">⚑ 해석 차이와 오류 전파<\/span><\/div><\/div><div class=\"content-card-info\"><div class=\"card-name\"><h2>2026 KAIST AI × 실패 아이디어<\/h2><span class=\"card-go\">↗<\/span><\/div><p>소형 LLM 기기 간 자율 소통에서 발생할 수 있는 실패 원인을 문헌과 사례로 분석했습니다.<\/p><div class=\"tag-row\"><span>LLM<\/span><span>Research<\/span><span>Pre-Mortem<\/span><\/div><small class=\"card-footer\">2단계 원인 진단 및 문헌·사례 자료조사 담당<\/small><\/div><\/a><a href=\"#/activities/workflow\" class=\"content-card\"><div class=\"content-card-art\"><span class=\"content-card-number\">02 / TEAMWORK<\/span><div class=\"art art-workflow\"><div class=\"flow-box\"><span>TEAM RULES<\/span><b>AGENTS.md<\/b><div class=\"fake-line long\"><\/div><div class=\"fake-line\"><\/div><div class=\"fake-line medium\"><\/div><div class=\"flow-check\">✓ Reviewed &amp; improved<\/div><\/div><span class=\"flow-star\">✳<\/span><\/div><\/div><div class=\"content-card-info\"><div class=\"card-name\"><h2>AI 협업 규칙 개선<\/h2><span class=\"card-go\">↗<\/span><\/div><p>팀원들과 AI 작업 규칙을 검토하고 수정하며 협업과 코드 검증 기준을 고민했습니다.<\/p><div class=\"tag-row\"><span>GitHub<\/span><span>AGENTS.md<\/span><span>Collaboration<\/span><\/div><small class=\"card-footer\">MEMO:RE 프로젝트 내 팀 활동<\/small><\/div><\/a><\/div><div class=\"page-end-hint\">카드를 누르면 자세한 내용을 볼 수 있어요. <span>♡<\/span><\/div><\/main>", "/about": "<main id=\"main\" class=\"shell inner-main about-main\"><div class=\"page-heading\"><a href=\"#/\" class=\"back-link\"><span>←<\/span> Home<\/a><div class=\"heading-copy\"><span class=\"page-index\">03 / ABOUT<\/span><h1>A little <em>about me<\/em><\/h1><p>기능을 만드는 즐거움과, 더 잘 만드는 방법을 고민하는 마음을 함께 키우고 있습니다.<\/p><\/div><span class=\"heading-flower\">✳<\/span><\/div><div class=\"about-grid\"><section class=\"about-personal\"><div class=\"about-symbol\">안 <span>✳<\/span><\/div><span class=\"about-hello\">HELLO AGAIN, I'M JIWON<\/span><h2>안지원 <small>AN JI WON<\/small><\/h2><p>한국항공대학교 소프트웨어공학과<br>2026.03 편입학 · 3학년 재학 중<\/p><div class=\"about-buttons\"><a class=\"button primary-button\" href=\"resume.pdf\" target=\"_blank\">이력서 PDF ↗<\/a><a class=\"button secondary-button\" href=\"https://github.com/anjw336\" target=\"_blank\">GitHub ↗<\/a><\/div><\/section><div class=\"about-content\"><span class=\"section-label compact\">MY MINDSET<\/span><h2>작은 오류도 그냥 지나치지 않고,<br>이유를 찾아보는 개발자.<\/h2><p>팀 프로젝트에서 개발 환경을 구성하고 데이터 저장 과정의 예외 상황을 검증하면서, 정상 동작뿐 아니라 예상하지 못한 문제를 고려하는 태도의 중요성을 배웠습니다.<\/p><p>AI의 도움으로 작성한 코드도 직접 검증하고 팀 작업 규칙 개선에 참여하며, 새로운 기술을 도입할 때 명확한 기준과 스스로 판단하는 자세가 필요하다는 것을 느꼈습니다.<\/p><p>앞으로도 배우고 검증하며, 함께 일하는 사람들이 신뢰할 수 있는 개발 환경을 만드는 엔지니어로 성장하고 싶습니다.<\/p><div class=\"about-skills\"><h3>TOOLS I WORK WITH<\/h3><div class=\"tag-row\"><span>TypeScript<\/span><span>JavaScript<\/span><span>React Native<\/span><span>Expo<\/span><span>Git CLI<\/span><span>GitHub<\/span><span>Zod<\/span><span>Kotlin<\/span><span>LibGDX<\/span><\/div><\/div><\/div><\/div><div class=\"contact-panel\"><div><span>HAVE A QUESTION?<\/span><h2>언제든 편하게 연락해 주세요. <em>♡<\/em><\/h2><p>함께 배우고, 문제를 해결하는 대화를 좋아합니다.<\/p><\/div><a class=\"button primary-button\" href=\"mailto:seraan123@gmail.com\">메일 보내기 ↗<\/a><\/div><\/main>", "/projects/memore": "<main id=\"main\" class=\"shell detail-main\"><a href=\"#/projects\" class=\"back-link\"><span>←<\/span> 목록으로 돌아가기<\/a><div class=\"detail-intro\"><div><span class=\"page-index\">01 / MOBILE APP<\/span><h1>MEMO:RE<\/h1><p>사진과 스티커로 추억을 티켓으로 만드는 모바일 앱. 프론트엔드 개발에 참여하며 ‘동작하는 기능’과 ‘안정적으로 동작하는 기능’의 차이를 배웠습니다.<\/p><div class=\"tag-row detail-tags\"><span>React Native<\/span><span>Expo<\/span><span>TypeScript<\/span><span>Zod<\/span><span>AsyncStorage<\/span><\/div><\/div><div class=\"detail-aside\"><div class=\"art art-memore\"><span class=\"art-floating-star\">✳<\/span><div class=\"ticket-mini\"><div class=\"ticket-top\">♡ A LITTLE MEMORY<\/div><div class=\"ticket-picture\"><span>✿<\/span><div><\/div><\/div><strong>MEMO:RE<\/strong><small>today becomes a keepsake.<\/small><div class=\"ticket-line\"><\/div><span class=\"ticket-foot\">2026 · MEMORY TICKET<\/span><\/div><\/div><\/div><\/div><div class=\"section-label\">PROBLEM SOLVING <span>✳<\/span><\/div><section class=\"note\"><div class=\"note-index\">01<span>✳<\/span><\/div><div class=\"note-body\"><h2>개발 환경과 코드 품질 기준<\/h2><div class=\"note-points\"><div><span class=\"note-label\">PROBLEM<\/span><p>프로젝트 초기 환경에서 코드 규칙 및 타입 검사 오류가 있었습니다.<\/p><\/div><div><span class=\"note-label\">SOLUTION<\/span><p>Expo 개발 환경을 구성하고 TypeScript strict, Lint 및 타입 오류를 수정해 팀 CI 검사를 통과했습니다.<\/p><\/div><div><span class=\"note-label\">LEARNING<\/span><p>협업에서는 기능 구현뿐 아니라 공통 검사 기준을 통과하는 코드가 중요하다는 점을 배웠습니다.<\/p><\/div><\/div><div class=\"note-links\"><a class=\"text-link\" href=\"https://github.com/rlawogml26-art/MIND-DO/pull/14\" target=\"_blank\">PR #14 ↗<\/a><\/div><\/div><\/section><section class=\"note\"><div class=\"note-index\">02<span>✳<\/span><\/div><div class=\"note-body\"><h2>중복 저장과 예외 상황을 검증<\/h2><div class=\"note-points\"><div><span class=\"note-label\">PROBLEM<\/span><p>비동기 발권 요청이 겹치거나 저장 데이터가 손상될 때 문제가 될 수 있었습니다.<\/p><\/div><div><span class=\"note-label\">SOLUTION<\/span><p>Zod와 팀 공통 입력 규칙을 활용하고, 비동기 저장을 순차 처리해 중복 저장을 방지했습니다. AI의 도움으로 작성한 검증 코드를 직접 실행했습니다.<\/p><\/div><div><span class=\"note-label\">LEARNING<\/span><p>손상 JSON·중복 요청·저장 실패 후 재시도까지 확인해야 안정성을 판단할 수 있음을 배웠습니다.<\/p><\/div><\/div><div class=\"note-links\"><a class=\"text-link\" href=\"https://github.com/rlawogml26-art/MIND-DO/pull/26\" target=\"_blank\">PR #26 ↗<\/a><\/div><\/div><\/section><section class=\"note\"><div class=\"note-index\">03<span>✳<\/span><\/div><div class=\"note-body\"><h2>기기별 사진 형식 호환성 개선<\/h2><div class=\"note-points\"><div><span class=\"note-label\">PROBLEM<\/span><p>사진 선택 과정에서 실행 환경 및 HEIC·HEIF 이미지 형식 호환성을 고려해야 했습니다.<\/p><\/div><div><span class=\"note-label\">SOLUTION<\/span><p>Expo Go에서 Development Client로 변경하고 HEIC·HEIF만 JPEG로 변환했습니다. 사진 선택·변환을 실기기에서 확인했습니다.<\/p><\/div><div><span class=\"note-label\">LEARNING<\/span><p>실제 제약에 필요한 범위만 바꾸는 판단이 중요했습니다.<\/p><\/div><\/div><div class=\"note-links\"><a class=\"text-link\" href=\"https://github.com/rlawogml26-art/MIND-DO/pull/27\" target=\"_blank\">PR #27 ↗<\/a><a class=\"text-link\" href=\"https://github.com/rlawogml26-art/MIND-DO/pull/68\" target=\"_blank\">PR #68 ↗<\/a><\/div><\/div><\/section><div class=\"detail-bottom\"><a href=\"#/projects\" class=\"button secondary-button\">← 목록으로 돌아가기<\/a><a href=\"#/\" class=\"button primary-button\">처음으로 ↗<\/a><\/div><\/main>", "/projects/game": "<main id=\"main\" class=\"shell detail-main\"><a href=\"#/projects\" class=\"back-link\"><span>←<\/span> 목록으로 돌아가기<\/a><div class=\"detail-intro\"><div><span class=\"page-index\">02 / KOTLIN GAME<\/span><h1>하늘에서 음식이 내린다면<\/h1><p>음식을 모아 점수를 얻는 3단계 데스크톱 게임. 입력 처리와 충돌·점수·상태 전환 로직을 구현했습니다.<\/p><div class=\"tag-row detail-tags\"><span>Kotlin<\/span><span>LibGDX<\/span><span>Gradle<\/span><\/div><\/div><div class=\"detail-aside\"><div class=\"art art-game\"><span class=\"art-game-star\">✳<\/span><div class=\"game-machine\"><div class=\"machine-top\"><span>♡<\/span><span>STAGE 03<\/span><span>✦<\/span><\/div><div class=\"game-clouds\"><span>☁<\/span><span>☁<\/span><span>☁<\/span><\/div><div class=\"game-food\"><span>🍓<\/span><span>🍪<\/span><span>🍋<\/span><\/div><div class=\"game-player\">◕‿◕<\/div><div class=\"game-ground\"><\/div><\/div><\/div><\/div><\/div><div class=\"section-label\">PROBLEM SOLVING <span>✳<\/span><\/div><section class=\"note\"><div class=\"note-index\">01<span>✳<\/span><\/div><div class=\"note-body\"><h2>게임 흐름과 다양한 상태 구현<\/h2><div class=\"note-points\"><div><span class=\"note-label\">PROBLEM<\/span><p>스테이지 이동, 충돌, 점수 및 타이머를 일관되게 처리해야 했습니다.<\/p><\/div><div><span class=\"note-label\">SOLUTION<\/span><p>키보드와 delta 기반 이동, 음식 충돌, 콤보, 버프·디버프, 3스테이지 팰리컨 QTE 등을 구현했습니다.<\/p><\/div><div><span class=\"note-label\">LEARNING<\/span><p>상태 변경을 기능별로 구분하는 코드 구조의 중요성을 배웠습니다.<\/p><\/div><\/div><\/div><\/section><section class=\"note\"><div class=\"note-index\">02<span>✳<\/span><\/div><div class=\"note-body\"><h2>AI 생성 코드와 구조 비교<\/h2><div class=\"note-points\"><div><span class=\"note-label\">PROBLEM<\/span><p>같은 기능도 코드 구조에 따라 수정 범위와 가독성이 달랐습니다.<\/p><\/div><div><span class=\"note-label\">SOLUTION<\/span><p>팀 구현의 역할별 함수 구조와, AI 생성 코드 updateInPlay 한 곳에 상태가 집중된 구조를 비교했습니다.<\/p><\/div><div><span class=\"note-label\">LEARNING<\/span><p>AI 코드도 책임 분리와 유지보수 가능성을 기준으로 검토해야 합니다.<\/p><\/div><\/div><\/div><\/section><div class=\"detail-bottom\"><a href=\"#/projects\" class=\"button secondary-button\">← 목록으로 돌아가기<\/a><a href=\"#/\" class=\"button primary-button\">처음으로 ↗<\/a><\/div><\/main>", "/activities/kaist": "<main id=\"main\" class=\"shell detail-main\"><a href=\"#/activities\" class=\"back-link\"><span>←<\/span> 목록으로 돌아가기<\/a><div class=\"detail-intro\"><div><span class=\"page-index\">01 / AI RESEARCH<\/span><h1>2026 KAIST AI × 실패 아이디어<\/h1><p>소형 LLM 기기들이 자연어로 소통하는 환경에서 작은 해석 차이가 연쇄적 실패로 이어질 수 있는 원인을 분석한 공모전입니다.<\/p><div class=\"tag-row detail-tags\"><span>LLM<\/span><span>Multi-Agent<\/span><span>Pre-Mortem<\/span><span>Research<\/span><\/div><\/div><div class=\"detail-aside\"><div class=\"art art-ai\"><div class=\"agent-card agent-a\"><small>agent A<\/small><strong>추천인가요?<\/strong><\/div><span class=\"agent-connector\">⋯⋯↗<\/span><div class=\"agent-card agent-b\"><small>agent B<\/small><strong>명령인가요?<\/strong><\/div><span class=\"agent-note\">⚑ 해석 차이와 오류 전파<\/span><\/div><\/div><\/div><div class=\"section-label\">PROBLEM SOLVING <span>✳<\/span><\/div><section class=\"note\"><div class=\"note-index\">01<span>✳<\/span><\/div><div class=\"note-body\"><h2>자연어 해석 차이와 오류 전파<\/h2><div class=\"note-points\"><div><span class=\"note-label\">PROBLEM<\/span><p>기기마다 ‘추천’과 ‘명령’을 다르게 받아들일 수 있습니다.<\/p><\/div><div><span class=\"note-label\">SOLUTION<\/span><p>멀티에이전트의 역할 충돌, 정보 누락, 간접 프롬프트 인젝션 관련 문헌과 사례를 조사했습니다.<\/p><\/div><div><span class=\"note-label\">LEARNING<\/span><p>명확한 명세와 검증 기준이 중요하다는 점을 배웠습니다.<\/p><\/div><\/div><\/div><\/section><section class=\"note\"><div class=\"note-index\">02<span>✳<\/span><\/div><div class=\"note-body\"><h2>실패 이후의 책임과 통제<\/h2><div class=\"note-points\"><div><span class=\"note-label\">PROBLEM<\/span><p>AI 사이의 상호작용에서 원인과 책임을 특정하기 어려울 수 있습니다.<\/p><\/div><div><span class=\"note-label\">SOLUTION<\/span><p>로그 보존, 사고 원인 규명, 책임 문제를 기술·검증·책임 관점으로 정리했습니다.<\/p><\/div><div><span class=\"note-label\">LEARNING<\/span><p>관찰 가능한 기록과 책임 범위도 시스템 설계의 중요한 요소입니다.<\/p><\/div><\/div><\/div><\/section><div class=\"detail-bottom\"><a href=\"#/activities\" class=\"button secondary-button\">← 목록으로 돌아가기<\/a><a href=\"#/\" class=\"button primary-button\">처음으로 ↗<\/a><\/div><\/main>", "/activities/workflow": "<main id=\"main\" class=\"shell detail-main\"><a href=\"#/activities\" class=\"back-link\"><span>←<\/span> 목록으로 돌아가기<\/a><div class=\"detail-intro\"><div><span class=\"page-index\">02 / TEAM WORKFLOW<\/span><h1>AI 협업 규칙 개선<\/h1><p>팀원들과 AI 작업 규칙을 검토하고 수정하며 협업과 코드 검증의 기준을 고민했습니다.<\/p><div class=\"tag-row detail-tags\"><span>AGENTS.md<\/span><span>Git<\/span><span>GitHub<\/span><span>Teamwork<\/span><\/div><\/div><div class=\"detail-aside\"><div class=\"art art-workflow\"><div class=\"flow-box\"><span>TEAM RULES<\/span><b>AGENTS.md<\/b><div class=\"fake-line long\"><\/div><div class=\"fake-line\"><\/div><div class=\"fake-line medium\"><\/div><div class=\"flow-check\">✓ Reviewed &amp; improved<\/div><\/div><span class=\"flow-star\">✳<\/span><\/div><\/div><\/div><div class=\"section-label\">PROBLEM SOLVING <span>✳<\/span><\/div><section class=\"note\"><div class=\"note-index\">01<span>✳<\/span><\/div><div class=\"note-body\"><h2>AI 사용에도 공통 기준이 필요하다<\/h2><div class=\"note-points\"><div><span class=\"note-label\">PROBLEM<\/span><p>AI 작성 코드도 프로젝트 구조와 코드 규칙을 따라야 했습니다.<\/p><\/div><div><span class=\"note-label\">SOLUTION<\/span><p>팀 회의에서 AGENTS.md 개선 의견을 제안하고 수정에 참여했습니다.<\/p><\/div><div><span class=\"note-label\">LEARNING<\/span><p>명확한 규칙이 있어야 결과를 검토하기 쉬워진다는 점을 배웠습니다.<\/p><\/div><\/div><\/div><\/section><section class=\"note\"><div class=\"note-index\">02<span>✳<\/span><\/div><div class=\"note-body\"><h2>검증 가능한 협업 과정<\/h2><div class=\"note-points\"><div><span class=\"note-label\">PROBLEM<\/span><p>기능 변경 후 다른 부분에 영향을 주지 않는지 검토해야 했습니다.<\/p><\/div><div><span class=\"note-label\">SOLUTION<\/span><p>Git CLI, Issue/PR, Lint·타입 검사 과정을 통해 변경 사항을 확인했습니다.<\/p><\/div><div><span class=\"note-label\">LEARNING<\/span><p>검사 도구와 기록이 함께 있어야 작업의 의도를 전달하기 쉽습니다.<\/p><\/div><\/div><\/div><\/section><div class=\"detail-bottom\"><a href=\"#/activities\" class=\"button secondary-button\">← 목록으로 돌아가기<\/a><a href=\"#/\" class=\"button primary-button\">처음으로 ↗<\/a><\/div><\/main>"};function update(){const route=decodeURIComponent(location.hash.slice(1)||'/');document.getElementById('content').innerHTML=pages[route]||pages['/'];document.querySelectorAll('.nav-item').forEach(e=>e.classList.toggle('selected',e.dataset.route===route || (e.dataset.route!=='/'&&route.startsWith(e.dataset.route+'/'))));document.title=(route==='/'?'Home':route.split('/').filter(Boolean).join(' / '))+' | 안지원';window.scrollTo(0,0)}window.addEventListener('hashchange',update);update();</script></body></html>
